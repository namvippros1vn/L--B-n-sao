<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart to QR - Nam Helios</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Canvas trái tim */
        #pinkboard {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); 
            z-index: 1;
            opacity: 1;
            transition: opacity 2.5s ease-in-out;
        }

        /* Container QR */
        #qr-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #qr-code {
            width: 300px;
            height: 300px;
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(255, 52, 144, 0.6);
        }

        #qr-code img {
            width: 100%;
            height: 100%;
        }

        .message {
            margin-top: 15px;
            color: white;
            font-size: 18px;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .show {
            opacity: 1 !important;
        }
    </style>
</head>

<body>
    <div class="container">
        <canvas id="pinkboard"></canvas>

        <div id="qr-container">
            <div id="qr-code">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://me-qr.com/AVSRUIF5">
            </div>
            <div class="message">Quét mã QR để khám phá</div>
        </div>
    </div>

    <script>
        var settings = {
            particles: {
                length: 4500,
                duration: 2.6,
                velocity: 200,
                effect: -0.7,
                size: 14,
            },
        };

        var Point = function(x, y) {
            this.x = x || 0;
            this.y = y || 0;
        };
        Point.prototype.clone = function() {
            return new Point(this.x, this.y);
        };
        Point.prototype.length = function(len) {
            if (len === undefined)
                return Math.sqrt(this.x * this.x + this.y * this.y);
            this.normalize();
            this.x *= len;
            this.y *= len;
            return this;
        };
        Point.prototype.normalize = function() {
            var length = this.length();
            this.x /= length;
            this.y /= length;
            return this;
        };

        var Particle = function() {
            this.position = new Point();
            this.velocity = new Point();
            this.acceleration = new Point();
            this.age = 0;
        };
        Particle.prototype.initialize = function(x, y, dx, dy) {
            this.position.x = x;
            this.position.y = y;
            this.velocity.x = dx;
            this.velocity.y = dy;
            this.acceleration.x = dx * settings.particles.effect;
            this.acceleration.y = dy * settings.particles.effect;
            this.age = 0;
        };
        Particle.prototype.update = function(dt) {
            this.position.x += this.velocity.x * dt;
            this.position.y += this.velocity.y * dt;
            this.velocity.x += this.acceleration.x * dt;
            this.velocity.y += this.acceleration.y * dt;
            this.age += dt;
        };
        Particle.prototype.draw = function(ctx, image) {
            function ease(t) { return (--t) * t * t + 1; }
            var size = image.width * ease(this.age / settings.particles.duration);
            ctx.globalAlpha = 1 - this.age / settings.particles.duration;
            ctx.drawImage(image,
                this.position.x - size / 2,
                this.position.y - size / 2,
                size, size
            );
        };

        var ParticlePool = function(length) {
            this.particles = new Array(length);
            for (var i = 0; i < length; i++)
                this.particles[i] = new Particle();
            this.firstActive = 0;
            this.firstFree = 0;
            this.duration = settings.particles.duration;
        };
        ParticlePool.prototype.add = function(x, y, dx, dy) {
            this.particles[this.firstFree].initialize(x, y, dx, dy);
            this.firstFree++;
            if (this.firstFree === this.particles.length) this.firstFree = 0;
            if (this.firstActive === this.firstFree) {
                this.firstActive++;
                if (this.firstActive === this.particles.length) this.firstActive = 0;
            }
        };
        ParticlePool.prototype.update = function(dt) {
            var i;
            if (this.firstActive < this.firstFree) {
                for (i = this.firstActive; i < this.firstFree; i++)
                    this.particles[i].update(dt);
            } else {
                for (i = this.firstActive; i < this.particles.length; i++)
                    this.particles[i].update(dt);
                for (i = 0; i < this.firstFree; i++)
                    this.particles[i].update(dt);
            }
            while (this.particles[this.firstActive].age >= this.duration &&
                   this.firstActive !== this.firstFree) {
                this.firstActive++;
                if (this.firstActive === this.particles.length) this.firstActive = 0;
            }
        };
        ParticlePool.prototype.draw = function(ctx, image) {
            var i;
            if (this.firstActive < this.firstFree) {
                for (i = this.firstActive; i < this.firstFree; i++)
                    this.particles[i].draw(ctx, image);
            } else {
                for (i = this.firstActive; i < this.particles.length; i++)
                    this.particles[i].draw(ctx, image);
                for (i = 0; i < this.firstFree; i++)
                    this.particles[i].draw(ctx, image);
            }
        };

        (function(canvas) {
            var ctx = canvas.getContext("2d");
            var particles = new ParticlePool(settings.particles.length);
            var particleRate = settings.particles.length / settings.particles.duration;
            var time;

            var heartPoint = function(t) {
                return new Point(
                    160 * Math.pow(Math.sin(t), 3),
                    130 * Math.cos(t) - 50 * Math.cos(2*t)
                    - 20 * Math.cos(3*t) - 10 * Math.cos(4*t) + 25
                );
            };

            var image = (function() {
                var c = document.createElement("canvas");
                var cx = c.getContext("2d");
                c.width = c.height = settings.particles.size;
                cx.beginPath();

                var t = -Math.PI, p = convert(t);
                cx.moveTo(p.x, p.y);
                function convert(t) {
                    var pt = heartPoint(t);
                    return new Point(
                        c.width/2 + pt.x * c.width / 350,
                        c.height/2 - pt.y * c.height / 350
                    );
                }
                while (t < Math.PI) {
                    t += 0.01;
                    p = convert(t);
                    cx.lineTo(p.x, p.y);
                }
                cx.fillStyle = "#ff1493";
                cx.fill();

                var img = new Image();
                img.src = c.toDataURL();
                return img;
            })();

            var startTime = new Date().getTime();
            var showQR = false;

            function render() {
                requestAnimationFrame(render);
                var newTime = new Date().getTime() / 1000;
                var dt = newTime - (time || newTime);
                time = newTime;

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                var now = new Date().getTime();
                var elapsed = now - startTime;

                /* 🔥 Sau 5s: trái tim mờ dần + QR xuất hiện */
                if (elapsed > 5000 && !showQR) {
                    showQR = true;
                    document.getElementById("pinkboard").style.opacity = "0";
                    setTimeout(() => {
                        document.getElementById("qr-container").classList.add("show");
                        setTimeout(() => {
                            document.querySelector(".message").classList.add("show");
                        }, 800);
                    }, 700);
                }

                /* Particle giảm dần để tạo hiệu ứng tan biến */
                var effectiveRate = particleRate;
                if (elapsed > 3500) {
                    effectiveRate *= Math.max(0, 1 - (elapsed - 3500) / 2000);
                }

                var amount = effectiveRate * dt;
                for (var i = 0; i < amount; i++) {
                    var pos = heartPoint(Math.PI - 2*Math.PI*Math.random());
                    var dir = pos.clone().length(settings.particles.velocity);
                    particles.add(
                        canvas.width/2 + pos.x,
                        canvas.height/2 - pos.y,
                        dir.x, -dir.y
                    );
                }

                particles.update(dt);
                particles.draw(ctx, image);
            }

            function resize() {
                canvas.width = window.innerWidth * 1.2;
                canvas.height = window.innerHeight * 1.2;
            }
            window.onresize = resize;

            resize();
            render();

        })(document.getElementById("pinkboard"));
    </script>

</body>
</html>
